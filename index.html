<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการซื้อของ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-3 sm:p-6 min-h-screen">
    
    <div class="max-w-4xl mx-auto bg-white p-4 sm:p-8 rounded-lg shadow-md">
        <h1 class="text-2xl sm:text-3xl font-semibold text-center text-blue-600 mb-4 sm:mb-6">ระบบภัตตาหาร แต่งตั้ง</h1>

        <div class="mb-6">
            <p class="text-xs sm:text-sm font-medium text-gray-700 mb-2">ตัวอย่างเมนูยอดฮิต (เลื่อนเพื่อเลือก):</p>
            <div class="flex overflow-x-auto gap-2 pb-2 sm:flex-wrap scrollbar-none">
                <button onclick="fillExample('คะน้าหมูกรอบ', 'อาหาร', 75)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">คะน้าหมูกรอบ (75฿)</button>
                <button onclick="fillExample('คะน้าหมูชิ้น', 'อาหาร', 65)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">คะน้าหมูชิ้น (65฿)</button>
                <button onclick="fillExample('กระเพราขาหมู', 'อาหาร', 80)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">กระเพราขาหมู (80฿)</button>
                <button onclick="fillExample('หมูทอดพริกสด', 'อาหาร', 65)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">หมูทอดพริกสด (65฿)</button>
                <button onclick="fillExample('กระเพราไก่', 'อาหาร', 65)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">กระเพราไก่ (65฿)</button>
                <button onclick="fillExample('หมูกรอบพริกเกลือ', 'อาหาร', 75)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">หมูกรอบพริกเกลือ (75฿)</button>
                <button onclick="fillExample('ข้าวผัดหมู', 'อาหาร', 65)" class="whitespace-nowrap bg-white border border-gray-300 rounded-full px-3 py-1.5 text-xs sm:text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">ข้าวผัดหมู (65฿)</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="col-span-2 md:col-span-2">
                <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                <input type="text" id="itemName" placeholder="เช่น ข้าวผัด, น้ำดื่ม..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="col-span-2 sm:col-span-1 md:col-span-1">
                <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">หมวดหมู่</label>
                <select id="itemCategory" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="อาหาร">อาหาร</option>
                    <option value="เครื่องดื่ม">เครื่องดื่ม</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>
            <div class="col-span-1">
                <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                <input type="number" id="itemPrice" min="0" placeholder="0" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="col-span-1">
                <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">จำนวน</label>
                <input type="number" id="itemQty" min="1" value="1" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        
        <button onclick="addItem()" class="w-full bg-blue-600 text-white font-medium py-2.5 px-4 rounded-lg hover:bg-blue-700 transition duration-200 mb-6 shadow active:scale-[0.99]">
            + เพิ่มรายการ
        </button>

        <div class="overflow-hidden">
            <div class="hidden md:grid md:grid-cols-12 bg-gray-800 text-white text-sm font-medium py-3 px-4 rounded-t-lg text-center">
                <div class="col-span-4 text-left">ชื่อสินค้า</div>
                <div class="col-span-2 text-left">หมวดหมู่</div>
                <div class="col-span-2 text-right">ราคา/หน่วย</div>
                <div class="col-span-1 text-right">จำนวน</div>
                <div class="col-span-2 text-right">รวม (บาท)</div>
                <div class="col-span-1 text-center">จัดการ</div>
            </div>

            <div id="cartContainer" class="space-y-3 md:space-y-0">
                </div>
        </div>

        <div class="mt-6 flex justify-end">
            <div class="w-full sm:w-auto bg-green-50 border border-green-300 text-green-800 px-4 sm:px-6 py-3 sm:py-4 rounded-lg font-semibold text-base sm:text-lg flex items-center justify-between sm:justify-start gap-3 shadow-sm">
                <span>ยอดรวมทั้งสิ้น:</span>
                <div>
                    <span id="grandTotal" class="text-2xl sm:text-3xl text-green-700">0.00</span>
                    <span class="text-sm sm:text-base ml-1">บาท</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cartItems = [];

        function fillExample(name, category, price) {
            document.getElementById('itemName').value = name;
            document.getElementById('itemCategory').value = category;
            document.getElementById('itemPrice').value = price;
            
            const qtyInput = document.getElementById('itemQty');
            qtyInput.value = 1;
            qtyInput.focus();
        }

        function addItem() {
            const nameInput = document.getElementById('itemName');
            const categoryInput = document.getElementById('itemCategory');
            const priceInput = document.getElementById('itemPrice');
            const qtyInput = document.getElementById('itemQty');

            const name = nameInput.value.trim();
            const category = categoryInput.value;
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value);

            if (!name) { alert('กรุณากรอกชื่อสินค้าครับ'); return; }
            if (isNaN(price) || price < 0) { alert('กรุณากรอกราคาให้ถูกต้องครับ'); return; }
            if (isNaN(qty) || qty <= 0) { alert('กรุณากรอกจำนวนให้ถูกต้องครับ'); return; }

            cartItems.push({ name, category, price, qty, subtotal: price * qty });

            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';
            
            renderTable();
        }

        function removeItem(index) {
            cartItems.splice(index, 1);
            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('cartContainer');
            const grandTotalDisplay = document.getElementById('grandTotal');
            
            container.innerHTML = '';
            let grandTotal = 0;

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500 border border-dashed rounded-lg md:border-none">
                        ยังไม่มีรายการสินค้า
                    </div>`;
            }

            cartItems.forEach((item, index) => {
                grandTotal += item.subtotal;
                let badgeClass = item.category === "อาหาร" ? "bg-orange-100 text-orange-700 border border-orange-200" : 
                                 item.category === "เครื่องดื่ม" ? "bg-blue-100 text-blue-700 border border-blue-200" : 
                                 "bg-gray-100 text-gray-700 border border-gray-200";

                const row = document.createElement('div');
                // Responsive Display: การ์ดในมือถือ (flex col) / แถวตารางใน PC (grid)
                row.className = "bg-white p-4 rounded-lg border border-gray-200 shadow-sm md:shadow-none md:border-b md:border-t-0 md:border-x-0 md:rounded-none md:p-0 md:grid md:grid-cols-12 md:gap-2 md:items-center hover:bg-gray-50 transition";
                
                row.innerHTML = `
                    <div class="flex justify-between items-start md:col-span-4 md:py-3 md:px-4">
                        <div>
                            <span class="font-medium text-gray-900 md:font-normal">${item.name}</span>
                            <span class="md:hidden ml-2 inline-block px-2 py-0.5 rounded text-xs ${badgeClass}">${item.category}</span>
                        </div>
                        <button onclick="removeItem(${index})" class="md:hidden text-red-500 hover:text-red-700 text-sm">ลบ</button>
                    </div>

                    <div class="hidden md:block md:col-span-2 md:py-3 md:px-4">
                        <span class="px-2 py-1 rounded text-xs ${badgeClass}">${item.category}</span>
                    </div>

                    <div class="mt-2 md:mt-0 flex justify-between text-sm text-gray-600 md:col-span-2 md:justify-end md:py-3 md:px-4">
                        <span class="md:hidden">ราคา/หน่วย:</span>
                        <span>${item.price.toFixed(2)} ฿</span>
                    </div>

                    <div class="flex justify-between text-sm text-gray-600 md:col-span-1 md:justify-end md:py-3 md:px-4">
                        <span class="md:hidden">จำนวน:</span>
                        <span>x${item.qty}</span>
                    </div>

                    <div class="mt-2 pt-2 border-t md:border-t-0 md:mt-0 md:pt-0 flex justify-between font-semibold text-gray-800 md:col-span-2 md:justify-end md:py-3 md:px-4">
                        <span class="md:hidden text-gray-600 font-normal">รวม:</span>
                        <span class="text-blue-600 md:text-gray-800">${item.subtotal.toFixed(2)} ฿</span>
                    </div>

                    <div class="hidden md:block md:col-span-1 md:text-center md:py-3 md:px-4">
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-1 rounded transition text-sm">ลบ</button>
                    </div>
                `;
                container.appendChild(row);
            });

            grandTotalDisplay.innerText = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        renderTable();
    </script>
</body>
</html>
