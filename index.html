<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Order — ระบบสั่งอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117;
    --card:#191c26;
    --card-2:#212533;
    --line:#2b3040;
    --text:#e8eaf2;
    --muted:#9aa2b8;
    --brand:#ff7a3d;
    --brand-2:#ffb347;
    --danger:#ff4d6d;
    --ok:#2ed573;
    --radius:16px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, #ff7a3d22, transparent 60%),
      radial-gradient(800px 500px at 95% 0%, #4d7cff22, transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto}

  /* ---------- Header ---------- */
  header{text-align:center;margin-bottom:28px}
  .logo{
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-size:clamp(26px,5vw,40px);font-weight:700;letter-spacing:-.5px;
  }
  header p{color:var(--muted);margin-top:6px;font-size:clamp(13px,2.5vw,15px)}

  /* ---------- Layout ---------- */
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:900px){
    .grid{grid-template-columns:1.25fr .85fr;align-items:start}
    .sticky{position:sticky;top:24px}
  }

  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  }
  .card h2{font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 span{font-size:20px}

  /* ---------- Form ---------- */
  .form-grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:560px){
    .form-grid{grid-template-columns:2fr 1fr 1fr auto}
  }
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:var(--muted);font-weight:500}
  input{
    width:100%;padding:12px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--card-2);color:var(--text);
    font-family:inherit;font-size:15px;outline:none;transition:.2s;
  }
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #ff7a3d33}
  input::placeholder{color:#5c6480}

  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:600;
    border-radius:12px;transition:.18s;font-size:15px;
  }
  .btn-add{
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#1a1203;padding:12px 22px;align-self:end;width:100%;
  }
  .btn-add:hover{transform:translateY(-2px);box-shadow:0 8px 20px #ff7a3d55}
  .btn-add:active{transform:translateY(0)}

  /* ---------- Order list ---------- */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .item{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--card-2);border:1px solid var(--line);
    border-radius:14px;padding:14px;animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .item .name{flex:1 1 140px;min-width:0}
  .item .name b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .name small{color:var(--muted);font-size:12.5px}

  .qty{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
  .qty button{
    width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;
    background:#2c3144;color:var(--text);font-size:17px;line-height:1;transition:.15s;
  }
  .qty button:hover{background:var(--brand);color:#1a1203}
  .qty span{min-width:26px;text-align:center;font-weight:700}

  .sum{font-weight:700;color:var(--brand-2);min-width:92px;text-align:right}
  .del{
    background:#ff4d6d1a;color:var(--danger);border:none;cursor:pointer;
    width:34px;height:34px;border-radius:10px;font-size:16px;transition:.15s;
  }
  .del:hover{background:var(--danger);color:#fff}

  .empty{text-align:center;padding:40px 10px;color:var(--muted)}
  .empty div{font-size:40px;margin-bottom:10px}

  /* ---------- Summary ---------- */
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .row:last-of-type{border-bottom:none}
  .row span:first-child{color:var(--muted)}
  .row b{font-weight:600}
  .total{
    margin-top:14px;padding:16px;border-radius:14px;
    background:linear-gradient(135deg,#ff7a3d22,#ffb34711);
    border:1px solid #ff7a3d44;display:flex;justify-content:space-between;align-items:center;
  }
  .total span{font-size:14px;color:var(--muted)}
  .total b{font-size:clamp(22px,5vw,28px);color:var(--brand-2)}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .btn-ghost{background:var(--card-2);color:var(--text);border:1px solid var(--line);padding:12px}
  .btn-ghost:hover{border-color:var(--danger);color:var(--danger)}
  .btn-ok{background:var(--ok);color:#06240f;padding:12px}
  .btn-ok:hover{filter:brightness(1.08)}
  .btn-ok:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);
    background:var(--card-2);border:1px solid var(--line);color:var(--text);
    padding:13px 22px;border-radius:999px;box-shadow:var(--shadow);
    transition:.3s;z-index:99;font-size:14px;max-width:90vw;text-align:center;
  }
  #toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🍜 Food Order</div>
    <p>ระบบสั่งอาหาร — เพิ่มเมนู ระบุราคา สรุปยอดอัตโนมัติ</p>
  </header>

  <div class="grid">

    <!-- ซ้าย: ฟอร์ม + รายการ -->
    <div>
      <div class="card">
        <h2><span>➕</span> เพิ่มเมนูอาหาร</h2>
        <form id="form" class="form-grid" autocomplete="off">
          <div class="field">
            <label for="name">ชื่อเมนู</label>
            <input id="name" type="text" placeholder="เช่น ข้าวผัดกะเพรา" required>
          </div>
          <div class="field">
            <label for="price">ราคา (บาท)</label>
            <input id="price" type="number" min="0" step="0.25" placeholder="60" required>
          </div>
          <div class="field">
            <label for="qty">จำนวน</label>
            <input id="qty" type="number" min="1" step="1" value="1" required>
          </div>
          <button class="btn btn-add" type="submit">เพิ่ม</button>
        </form>
      </div>

      <div class="card" style="margin-top:20px">
        <h2><span>🧾</span> รายการที่สั่ง (<span id="count">0</span> เมนู)</h2>
        <div id="list" class="list"></div>
      </div>
    </div>

    <!-- ขวา: สรุป -->
    <div class="sticky">
      <div class="card">
        <h2><span>📊</span> สรุปคำสั่งซื้อ</h2>
        <div class="row"><span>จำนวนเมนู</span><b id="sMenu">0 เมนู</b></div>
        <div class="row"><span>จำนวนอาหารทั้งหมด</span><b id="sQty">0 จาน</b></div>

        <div class="total">
          <span>ราคารวมทั้งหมด</span>
          <b id="sTotal">0.00 ฿</b>
        </div>

        <div class="actions">
          <button class="btn btn-ghost" id="clear">ล้างทั้งหมด</button>
          <button class="btn btn-ok" id="order" disabled>ยืนยันสั่ง</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const KEY = 'food-order-items';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');

const $ = id => document.getElementById(id);
const baht = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ฿';

function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function render(){
  const list = $('list');

  if(items.length === 0){
    list.innerHTML = `<div class="empty"><div>🍽️</div>ยังไม่มีรายการอาหาร<br>เพิ่มเมนูแรกของคุณได้เลย</div>`;
  } else {
    list.innerHTML = items.map((it,i) => `
      <div class="item">
        <div class="name">
          <b>${escapeHtml(it.name)}</b>
          <small>${baht(it.price)} / จาน</small>
        </div>
        <div class="qty">
          <button type="button" onclick="changeQty(${i},-1)">−</button>
          <span>${it.qty}</span>
          <button type="button" onclick="changeQty(${i},1)">+</button>
        </div>
        <div class="sum">${baht(it.price * it.qty)}</div>
        <button class="del" type="button" onclick="removeItem(${i})" title="ลบ">✕</button>
      </div>`).join('');
  }

  const totalQty   = items.reduce((s,i) => s + i.qty, 0);
  const totalPrice = items.reduce((s,i) => s + i.price * i.qty, 0);

  $('count').textContent  = items.length;
  $('sMenu').textContent  = items.length + ' เมนู';
  $('sQty').textContent   = totalQty + ' จาน';
  $('sTotal').textContent = baht(totalPrice);
  $('order').disabled     = items.length === 0;

  save();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function changeQty(i, d){
  items[i].qty += d;
  if(items[i].qty < 1) items.splice(i,1);
  render();
}

function removeItem(i){
  toast(`ลบ "${items[i].name}" แล้ว`);
  items.splice(i,1);
  render();
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name  = $('name').value.trim();
  const price = parseFloat($('price').value);
  const qty   = parseInt($('qty').value);

  if(!name || isNaN(price) || price < 0 || isNaN(qty) || qty < 1){
    return toast('กรอกข้อมูลให้ครบถ้วนและถูกต้อง');
  }

  // ถ้าชื่อ + ราคาซ้ำ ให้เพิ่มจำนวนแทน
  const found = items.find(i => i.name.toLowerCase() === name.toLowerCase() && i.price === price);
  if(found) found.qty += qty;
  else items.push({name, price, qty});

  e.target.reset();
  $('qty').value = 1;
  $('name').focus();
  render();
  toast(`เพิ่ม "${name}" แล้ว`);
});

$('clear').addEventListener('click', () => {
  if(items.length === 0) return;
  if(confirm('ต้องการล้างรายการทั้งหมดใช่ไหม?')){
    items = [];
    render();
    toast('ล้างรายการทั้งหมดแล้ว');
  }
});

$('order').addEventListener('click', () => {
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  const qty   = items.reduce((s,i) => s + i.qty, 0);
  toast(`สั่งอาหารสำเร็จ! ${qty} จาน รวม ${baht(total)}`);
  items = [];
  render();
});

render();
</script>
</body>
</html>
