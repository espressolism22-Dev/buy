<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการซื้อของ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-semibold text-center text-blue-600 mb-6">ระบบภัตตาหาร แต่งตั้ง</h1>

        <!-- ส่วนเมนูตัวอย่างที่อัปเดตใหม่ -->
        <div class="mb-6">
            <p class="text-sm font-medium text-gray-700 mb-3">ตัวอย่างเมนูยอดฮิต (คลิกเพื่อเลือก):</p>
            <div class="flex flex-wrap gap-3">
                <button onclick="fillExample('คะน้าหมูกรอบ', 'อาหาร', 75)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">คะน้าหมูกรอบ (75 บาท)</button>
                <button onclick="fillExample('คะน้าหมูชิ้น', 'อาหาร', 65)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">คะน้าหมูชิ้น (65 บาท)</button>
                <button onclick="fillExample('กระเพราขาหมู', 'อาหาร', 80)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">กระเพราขาหมู (80 บาท)</button>
                <button onclick="fillExample('หมูทอดพริกสด', 'อาหาร', 65)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">หมูทอดพริกสด (65 บาท)</button>
                <button onclick="fillExample('กระเพราไก่', 'อาหาร', 65)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">กระเพราไก่ (65 บาท)</button>
                <button onclick="fillExample('หมูกรอบพริกเกลือ', 'อาหาร', 75)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">หมูกรอบพริกเกลือ (75 บาท)</button>
                <button onclick="fillExample('ข้าวผัดหมู', 'อาหาร', 65)" class="bg-white border border-gray-300 rounded-full px-4 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:border-orange-400 hover:text-orange-700 transition shadow-sm">ข้าวผัดหมู (65 บาท)</button>
            </div>
        </div>

        <!-- ฟอร์มสำหรับกรอกข้อมูล -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                <input type="text" id="itemName" placeholder="เช่น ข้าวผัด, น้ำดื่ม..." class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">หมวดหมู่</label>
                <select id="itemCategory" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="อาหาร">อาหาร</option>
                    <option value="เครื่องดื่ม">เครื่องดื่ม</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                <input type="number" id="itemPrice" min="0" placeholder="0" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">จำนวน</label>
                <input type="number" id="itemQty" min="1" value="1" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        
        <button onclick="addItem()" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded hover:bg-blue-700 transition duration-200 mb-8 shadow">
            + เพิ่มรายการ
        </button>

        <!-- ตารางแสดงรายการ -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white text-sm">
                        <th class="py-3 px-4 rounded-tl-lg">ชื่อสินค้า</th>
                        <th class="py-3 px-4">หมวดหมู่</th>
                        <th class="py-3 px-4 text-right">ราคา/หน่วย</th>
                        <th class="py-3 px-4 text-right">จำนวน</th>
                        <th class="py-3 px-4 text-right">รวม (บาท)</th>
                        <th class="py-3 px-4 rounded-tr-lg text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="cartTableBody">
                    <!-- ข้อมูลถูกสร้างผ่าน JS -->
                </tbody>
            </table>
        </div>

        <!-- ยอดเงินรวม -->
        <div class="mt-6 flex justify-end">
            <div class="bg-green-50 border border-green-300 text-green-800 px-6 py-4 rounded-lg font-semibold text-lg flex items-center gap-4 shadow-sm">
                <span>ยอดรวมทั้งสิ้น:</span>
                <span id="grandTotal" class="text-3xl text-green-700">0.00</span>
                <span>บาท</span>
            </div>
        </div>
    </div>

    <script>
        let cartItems = [];

        // ฟังก์ชันนำข้อมูลจากปุ่มตัวอย่างมาเติมในฟอร์ม
        function fillExample(name, category, price) {
            document.getElementById('itemName').value = name;
            document.getElementById('itemCategory').value = category;
            document.getElementById('itemPrice').value = price;
            
            const qtyInput = document.getElementById('itemQty');
            qtyInput.value = 1;
            qtyInput.focus(); // โฟกัสที่ช่องจำนวนเพื่อให้พร้อมแก้ไขหรือกด Enter (ถ้ามีการเขียนดักจับ Enter เพิ่ม)
        }

        function addItem() {
            const nameInput = document.getElementById('itemName');
            const categoryInput = document.getElementById('itemCategory');
            const priceInput = document.getElementById('itemPrice');
            const qtyInput = document.getElementById('itemQty');

            const name = nameInput.value.trim();
            const category = categoryInput.value;
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value);

            if (!name) { alert('กรุณากรอกชื่อสินค้าครับ'); return; }
            if (isNaN(price) || price < 0) { alert('กรุณากรอกราคาให้ถูกต้องครับ'); return; }
            if (isNaN(qty) || qty <= 0) { alert('กรุณากรอกจำนวนให้ถูกต้องครับ'); return; }

            cartItems.push({ name, category, price, qty, subtotal: price * qty });

            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';
            
            renderTable();
        }

        function removeItem(index) {
            cartItems.splice(index, 1);
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('cartTableBody');
            const grandTotalDisplay = document.getElementById('grandTotal');
            
            tableBody.innerHTML = '';
            let grandTotal = 0;

            if (cartItems.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">ยังไม่มีรายการสินค้า</td></tr>`;
            }

            cartItems.forEach((item, index) => {
                grandTotal += item.subtotal;
                let badgeClass = item.category === "อาหาร" ? "bg-orange-100 text-orange-700 border border-orange-200" : 
                                 item.category === "เครื่องดื่ม" ? "bg-blue-100 text-blue-700 border border-blue-200" : 
                                 "bg-gray-100 text-gray-700 border border-gray-200";

                const row = document.createElement('tr');
                row.className = "border-b hover:bg-gray-50 transition";
                row.innerHTML = `
                    <td class="py-3 px-4">${item.name}</td>
                    <td class="py-3 px-4"><span class="px-2 py-1 rounded text-xs ${badgeClass}">${item.category}</span></td>
                    <td class="py-3 px-4 text-right">${item.price.toFixed(2)}</td>
                    <td class="py-3 px-4 text-right">${item.qty}</td>
                    <td class="py-3 px-4 text-right font-medium">${item.subtotal.toFixed(2)}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1 rounded transition">ลบ</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            grandTotalDisplay.innerText = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        renderTable();
    </script>
</body>
</html>
